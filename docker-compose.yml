services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "${SERVER_PORT:-3001}:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://repin:repin@postgres:5432/repin}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: 3001
      SERVER_REQUEST_TIMEOUT: ${SERVER_REQUEST_TIMEOUT:-25000}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev-access-secret-change-me}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev-refresh-secret-change-me}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-900000}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-604800000}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-repin-server}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-60000}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-5-mini}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-120000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      BACKEND_API_URL: http://server:3001/api
    depends_on:
      server:
        condition: service_started
    restart: always

  extension:
    profiles: ["extension"]
    build:
      context: .
      dockerfile: apps/extension/Dockerfile
      target: exporter
    volumes:
      - ./extension-dist:/output

  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repin}
      POSTGRES_DB: ${POSTGRES_DB:-repin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
