services:
  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: repin-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://repin:repin@postgres:5432/repin
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: repin-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    restart: always

  postgres:
    image: postgres:17-alpine
    container_name: repin-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=repin
      - POSTGRES_PASSWORD=repin
      - POSTGRES_DB=repin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repin -d repin"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:8-alpine
    container_name: repin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
